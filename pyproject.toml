[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microbial-function-discovery"
version = "0.1.0"
description = "Microbial genome foundation model scaffold for useful-function discovery."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Miyu Horiuchi"}
]
dependencies = []

[project.scripts]
mfd = "microbial_function_discovery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
